# Builds the SMB Sync phone app (random/smbsync_app) and publishes it to the
# rolling GitHub release "smbsync-latest":
#   smbsync.apk           — Android, install directly
#   smbsync-unsigned.ipa  — iPhone, install with Sideloadly / AltStore (signs it with your Apple ID)
name: SMB Sync app

on:
  push:
    branches: [main]
    paths:
      - 'random/smbsync_app/**'
      - '.github/workflows/smbsync_app.yml'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.9'

defaults:
  run:
    working-directory: random/smbsync_app

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: tool/setup_platforms.sh
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Release signing key (keeps the same signature so updates install over the old app)
        env:
          KEYSTORE_B64: ${{ secrets.SMBSYNC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/smbsync.p12"
            echo "SMBSYNC_KEYSTORE=$RUNNER_TEMP/smbsync.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No SMBSYNC_KEYSTORE_BASE64 secret — APK is signed with a throwaway debug key"
          fi
      - run: flutter build apk --release
        env:
          SMBSYNC_KEYSTORE_PASSWORD: ${{ secrets.SMBSYNC_KEYSTORE_PASSWORD }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk smbsync.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: random/smbsync_app/smbsync.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: tool/setup_platforms.sh
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr smbsync-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: random/smbsync_app/smbsync-unsigned.ipa

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: smbsync-latest
          name: SMB Sync (latest build)
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            Built from ${{ github.sha }}.
            Android: download smbsync.apk on the phone and open it.
            iPhone: install smbsync-unsigned.ipa with Sideloadly or AltStore — see random/smbsync_app/README.md.
          files: |
            out/smbsync.apk
            out/smbsync-unsigned.ipa
