#config-version=FGT100F-7.6.2-FW-build3462-250131:opmode=0:vdom=0:user=admin
#conf_file_ver=812345678901234
#buildno=3462
#global_vdom=1
config system global
    set admin-https-ssl-versions tlsv1-1 tlsv1-2 tlsv1-3
    set admintimeout 30
    set alias "FGT100F"
    set hostname "FGT-EDGE-01"
    set timezone "America/Chicago"
    set admin-lockout-threshold 5
    set gui-display-hostname enable
    set pre-login-banner enable
end
config system accprofile
    edit "prof_admin"
        set secfabgrp read-write
        set ftviewgrp read-write
        set authgrp read-write
        set sysgrp read-write
        set netgrp read-write
        set loggrp read-write
        set fwgrp read-write
        set vpngrp read-write
        set utmgrp read-write
        set wanoptgrp read-write
        set wifi read-write
    next
    edit "readonly"
        set secfabgrp read
        set ftviewgrp read
        set authgrp read
        set sysgrp read
        set netgrp read
        set loggrp read
        set fwgrp read
        set vpngrp read
        set utmgrp read
    next
end
config system interface
    edit "port1"
        set vdom "root"
        set ip 203.0.113.10 255.255.255.248
        set allowaccess ping https ssh fgfm
        set type physical
        set role wan
        set snmp-index 1
    next
    edit "port2"
        set vdom "root"
        set ip 10.10.10.1 255.255.255.0
        set allowaccess ping https ssh http telnet snmp
        set type physical
        set description "Inside LAN"
        set role lan
        set snmp-index 2
    next
    edit "port3"
        set vdom "root"
        set ip 172.16.20.1 255.255.255.0
        set allowaccess ping
        set type physical
        set role dmz
        set snmp-index 3
    next
    edit "port4"
        set vdom "root"
        set type physical
        set snmp-index 4
    next
    edit "mgmt"
        set vdom "root"
        set ip 192.168.1.99 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set dedicated-to management
        set description "OOB management"
        set role lan
        set snmp-index 5
    next
    edit "ssl.root"
        set vdom "root"
        set type tunnel
        set alias "SSL VPN interface"
        set snmp-index 6
    next
    edit "to-branch"
        set vdom "root"
        set type tunnel
        set snmp-index 7
        set interface "port1"
    next
end
config system password-policy
    set status enable
    set minimum-length 10
    set min-upper-case-letter 1
    set min-number 1
end
config system replacemsg admin "pre_admin-disclaimer-text"
    set buffer "WARNING: Authorized use only.
All activity is monitored and logged."
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set vdom "root"
        set password ENC SH2xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    next
    edit "netops"
        set accprofile "super_admin"
        set vdom "root"
        set trusthost1 10.10.10.0 255.255.255.0
        set trusthost2 192.168.1.0 255.255.255.0
        set two-factor fortitoken
        set fortitoken "FTKMOB0000000001"
        set email-to "netops@example.com"
        set password ENC SH2yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy
    next
    edit "auditor"
        set accprofile "readonly"
        set vdom "root"
        set password ENC SH2zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz
    next
end
config system ha
    set group-name "EDGE-HA"
    set mode a-p
    set hbdev "port4" 50
    set override disable
end
config system dns
    set primary 10.10.10.53
end
config system ntp
    set ntpsync enable
    set type custom
    config ntpserver
        edit 1
            set server "10.10.10.123"
        next
    end
end
config system snmp sysinfo
    set status enable
    set description "Edge firewall"
    set contact-info "netops"
    set location "DC1"
end
config system snmp community
    edit 1
        set name "public"
        config hosts
            edit 1
                set ip 0.0.0.0 0.0.0.0
            next
        end
    next
end
config system snmp user
    edit "snmpv3mon"
        set notify-hosts 10.10.10.50
        set security-level auth-priv
        set auth-proto sha256
        set auth-pwd ENC xxxxxxxx
        set priv-proto aes256
        set priv-pwd ENC xxxxxxxx
    next
end
config system automation-stitch
    edit "Compromised Host Quarantine"
        set status disable
        set trigger "Compromised Host - High"
    next
end
config system zone
    edit "INSIDE"
        set intrazone allow
        set interface "port2" "port3"
    next
end
config system fortiguard
    set update-server-location automatic
end
config log fortianalyzer setting
    set status enable
    set server "10.10.10.60"
    set certificate-verification disable
end
config log syslogd setting
    set status enable
    set server "10.10.10.61"
end
config log eventfilter
    set event enable
end
config firewall address
    edit "all"
    next
    edit "LAN_NET"
        set subnet 10.10.10.0 255.255.255.0
    next
    edit "DMZ_NET"
        set subnet 172.16.20.0 255.255.255.0
    next
    edit "WEB01"
        set subnet 172.16.20.10 255.255.255.255
    next
    edit "ANY_V4"
        set comment "legacy catch-all"
    next
    edit "BRANCH_NET"
        set subnet 10.20.0.0 255.255.0.0
    next
end
config firewall addrgrp
    edit "INTERNAL_NETS"
        set member "LAN_NET" "DMZ_NET"
    next
end
config firewall service custom
    edit "ALL"
        set category "General"
        set protocol IP
    next
    edit "HTTP"
        set category "Web Access"
        set tcp-portrange 80
    next
    edit "HTTPS"
        set category "Web Access"
        set tcp-portrange 443
    next
    edit "SSH"
        set category "Remote Access"
        set tcp-portrange 22
    next
    edit "TELNET"
        set category "Remote Access"
        set tcp-portrange 23
    next
    edit "FTP"
        set category "File Access"
        set tcp-portrange 21
    next
    edit "DNS"
        set category "Network Services"
        set tcp-portrange 53
        set udp-portrange 53
    next
    edit "APP_8080"
        set tcp-portrange 8080
    next
    edit "HIGH_TCP"
        set tcp-portrange 1-65535
    next
end
config firewall service group
    edit "WEB_SVCS"
        set member "HTTP" "HTTPS"
    next
end
config firewall vip
    edit "VIP_WEB01"
        set extip 203.0.113.11
        set mappedip "172.16.20.10"
        set extintf "port1"
        set portforward enable
        set extport 443
        set mappedport 443
    next
end
config antivirus profile
    edit "default"
        set comment "Scan files and block viruses."
        config http
            set av-scan block
        end
        config ftp
            set av-scan block
        end
    next
end
config webfilter profile
    edit "default"
        set comment "Default web filtering."
    next
end
config dnsfilter profile
    edit "default"
        set comment "Default dns filtering."
        config ftgd-dns
            config filters
                edit 1
                    set category 2
                next
            end
        end
    next
end
config ips sensor
    edit "default"
        set comment "Prevent critical attacks."
        config entries
            edit 1
                set severity medium high critical
            next
        end
    next
end
config application list
    edit "default"
        set comment "Monitor all applications."
        config entries
            edit 1
                set action pass
            next
        end
    next
end
config firewall policy
    edit 1
        set name "LAN-to-Internet"
        set uuid 11111111-1111-1111-1111-111111111111
        set srcintf "port2"
        set dstintf "port1"
        set action accept
        set srcaddr "LAN_NET"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set av-profile "default"
        set webfilter-profile "default"
        set dnsfilter-profile "default"
        set ips-sensor "default"
        set application-list "default"
        set logtraffic all
        set nat enable
        set comments "Outbound internet for users"
    next
    edit 2
        set name "Inbound-WEB01"
        set srcintf "port1"
        set dstintf "port3"
        set action accept
        set srcaddr "all"
        set dstaddr "VIP_WEB01"
        set schedule "always"
        set service "HTTPS"
    next
    edit 3
        set name "Legacy-Any"
        set srcintf "any"
        set dstintf "any"
        set action accept
        set srcaddr "ANY_V4"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic disable
    next
    edit 4
        set name "LAN-Telnet-DMZ"
        set srcintf "port2"
        set dstintf "port3"
        set action accept
        set srcaddr "LAN_NET"
        set dstaddr "DMZ_NET"
        set schedule "always"
        set service "TELNET" "FTP"
        set comments "Old jump host access"
    next
    edit 5
        set name "Old-Test"
        set status disable
        set srcintf "port2"
        set dstintf "port3"
        set action accept
        set srcaddr "LAN_NET"
        set dstaddr "WEB01"
        set schedule "always"
        set service "SSH"
    next
    edit 6
        set name "Branch-VPN"
        set srcintf "to-branch"
        set dstintf "port2"
        set action accept
        set srcaddr "BRANCH_NET"
        set dstaddr "LAN_NET"
        set schedule "always"
        set service "HIGH_TCP"
        set logtraffic all
        set comments "Site-to-site"
    next
end
config firewall local-in-policy
    edit 1
        set intf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set service "HTTPS" "SSH"
        set schedule "always"
    next
end
config vpn ipsec phase1-interface
    edit "to-branch"
        set interface "port1"
        set ike-version 1
        set mode aggressive
        set peertype any
        set net-device disable
        set proposal des-md5 3des-sha1 aes128-sha1
        set dhgrp 2 5
        set remote-gw 198.51.100.20
        set psksecret ENC xxxxxxxx
    next
end
config vpn ipsec phase2-interface
    edit "to-branch-p2"
        set phase1name "to-branch"
        set proposal aes128-sha1 3des-md5
        set pfs disable
        set src-subnet 10.10.10.0 255.255.255.0
        set dst-subnet 10.20.0.0 255.255.0.0
    next
end
config vpn ssl settings
    set ssl-min-proto-ver tls1-1
    set servercert "Fortinet_Factory"
    set tunnel-ip-pools "SSLVPN_TUNNEL_ADDR1"
    set source-interface "port1"
    set source-address "all"
    set default-portal "full-access"
end
config user ldap
    edit "CORP-AD"
        set server "10.10.10.20"
        set cnid "sAMAccountName"
        set dn "dc=corp,dc=example,dc=com"
        set type regular
        set username "svc_fgt"
        set password ENC xxxxxxxx
        set server-identity-check disable
    next
end
config router static
    edit 1
        set gateway 203.0.113.9
        set device "port1"
    next
    edit 2
        set dst 10.20.0.0 255.255.0.0
        set device "to-branch"
    next
end
