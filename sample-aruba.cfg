hostname CX6300-LAB-SW01
!
banner motd "Authorized access only"
!
vlan 1
    name default
vlan 10
    name management
vlan 20
    name servers
vlan 30
    name users
!
interface mgmt
    ip static 192.168.0.1/24
    default-gateway 192.168.0.254
    no shutdown
!
interface 1/1/1
    description Uplink-to-Core
    no shutdown
    vlan trunk native 1
    vlan trunk allowed 10,20,30
!
interface 1/1/2
    description Server-Port
    no shutdown
    vlan access 20
    spanning-tree bpduguard
    spanning-tree portfast
    ip dhcp-snooping trust
!
interface 1/1/3
    description User-Port
    no shutdown
    vlan access 30
    spanning-tree bpduguard
    spanning-tree portfast
!
interface 1/1/4
    description Unused
    shutdown
!
interface 1/1/5
    description Risky-No-BPDU-Guard
    no shutdown
    vlan access 30
!
interface vlan 10
    ip address 10.10.10.1/24
    no shutdown
!
interface vlan 20
    ip address 10.20.20.1/24
    no shutdown
!
access-list ip BLOCK-TELNET
    10 deny tcp any any eq 23
    20 permit any any any
!
access-list ip MGMT-ACCESS
    10 permit tcp 192.168.0.0/24 any eq 22
    20 deny any any any
!
aaa authentication login default group radius local
aaa authentication login console local
aaa authorization commands default group tacacs+ local
aaa accounting all default start-stop group tacacs+
!
radius-server host 192.168.1.100
    key secretkey
radius-server host 192.168.1.101
    key secretkey2
!
tacacs-server host 192.168.1.110
    key tackey
!
snmp-server community public manager
snmp-server community private manager
snmp-server host 192.168.1.200 trap version 2c public
!
ntp server 0.pool.ntp.org
ntp server 1.pool.ntp.org
!
logging 192.168.1.201
logging severity informational
!
user admin
    password plaintext admin123
!
user operator
    password ciphertext AQBapJJGabc123DEF456GHI789JKLmno
!
user netops
    group administrators
!
ip dhcp snooping
ip dhcp snooping vlan 20,30
!
ip arp inspection
ip arp inspection vlan 20
!
spanning-tree
spanning-tree config-name CX6300-LAB
!
no telnet-server
!
ssh server vrf default
